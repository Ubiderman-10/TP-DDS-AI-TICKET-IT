openapi: 3.0.0
info:
  title: Categorías
  version: 1.0.0
  description: Gestión de categorías de eventos.
servers:
  - url: http://localhost:3000/api
    description: Servidor local de desarrollo
paths:
  /categorias:
    get:
      summary: Listar categorías
      tags:
        - Categoria
      responses:
        '200':
          description: Lista de categorías.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crear categoría
      tags:
        - Categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Categoria'
      responses:
        '201':
          description: Creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '400':
          description: Datos inválidos (nombre o descripcion faltantes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Categoria:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Música
        descripcion:
          type: string
          example: Eventos musicales
    Error:
      type: object
      properties:
        error:
          type: boolean
          example: true
        message:
          type: string
          example: nombre y descripcion son requeridos
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - CONFLICT
            - FORBIDDEN
            - INTERNAL_ERROR
          example: VALIDATION_ERROR
