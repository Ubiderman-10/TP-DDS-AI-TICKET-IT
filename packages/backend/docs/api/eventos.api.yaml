openapi: 3.0.0
info:
  title: API - Eventos
  version: 1.0.0
  description: |
    Gestión de eventos para la plataforma AI Ticket It.
servers:
  - url: http://localhost:3000/api
    description: Servidor local de desarrollo
paths:
  /eventos:
    get:
      summary: Listar eventos
      tags:
        - Evento
      parameters:
        - name: texto
          in: query
          description: Texto a buscar en nombre o descripción
          required: false
          schema:
            type: string
        - name: categoriaId
          in: query
          description: Filtrar por categoría
          required: false
          schema:
            type: integer
        - name: orden
          in: query
          description: Ordenar por precio, fecha o puntaje del organizador
          required: false
          schema:
            type: string
            enum:
              - precio
              - fecha
              - puntajeOrganizador
      responses:
        '200':
          description: Lista de eventos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evento'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crear un evento con sus tipos de entrada
      tags:
        - Evento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
                - descripcion
                - fecha
                - categoriaId
                - organizadorId
              properties:
                nombre:
                  type: string
                  example: Concierto Rock
                descripcion:
                  type: string
                  example: Concierto de rock nacional
                fecha:
                  type: string
                  format: date-time
                  example: 2026-11-05T21:00:00.000Z
                categoriaId:
                  type: integer
                  example: 1
                organizadorId:
                  type: integer
                  example: 1
                multimedia:
                  type: array
                  items:
                    type: string
                  example: ["https://ejemplo.com/rock.jpg"]
                tiposEntrada:
                  type: array
                  items:
                    type: object
                    properties:
                      nombre:
                        type: string
                        example: General
                      descripcion:
                        type: string
                        example: Campo
                      precio:
                        type: number
                        example: 2000
                      cupo:
                        type: integer
                        example: 200
      responses:
        '201':
          description: Evento creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '400':
          description: Campos faltantes o inválidos (nombre, descripcion, fecha, categoriaId, organizadorId).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Categoría u organizador no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /eventos/{eventoId}:
    get:
      summary: Obtener un evento
      tags:
        - Evento
      parameters:
        - name: eventoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle del evento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '404':
          description: Evento no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Evento:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Confeti Fest
        descripcion:
          type: string
          example: Festival de confeti
        fecha:
          type: string
          format: date-time
          example: 2026-10-20T20:00:00.000Z
        multimedia:
          type: array
          items:
            type: string
          example: ["https://ejemplo.com/confeti.jpg"]
        categoria:
          $ref: '#/components/schemas/Categoria'
        organizador:
          $ref: '#/components/schemas/Usuario'
        tiposEntrada:
          type: array
          items:
            $ref: '#/components/schemas/TipoEntrada'
    Categoria:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Música
        descripcion:
          type: string
          example: Eventos musicales
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: Pérez
    TipoEntrada:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: General
        descripcion:
          type: string
          example: Campo
        precio:
          type: number
          example: 1000
        cupo:
          type: integer
          example: 100
    Error:
      type: object
      properties:
        error:
          type: boolean
          example: true
        message:
          type: string
          example: nombre, descripcion, fecha, categoriaId y organizadorId son requeridos
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - CONFLICT
            - FORBIDDEN
            - INTERNAL_ERROR
          example: VALIDATION_ERROR
