openapi: 3.0.0
info:
  title: API - Reseñas
  version: 1.0.0
  description: |
    Crear y visualizar reseñas de eventos por compradores.
servers:
  - url: http://localhost:3000/api
    description: Servidor local de desarrollo
paths:
  /eventos/{eventoId}/resenas:
    get:
      summary: Listar reseñas de un evento
      tags:
        - Reseña
      parameters:
        - name: eventoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de reseñas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reseña'
        '404':
          description: Evento no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /eventos/{eventoId}/resenas:
    post:
      summary: Crear reseña para un evento
      tags:
        - Reseña
      parameters:
        - name: eventoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                compradorId:
                  type: integer
                  example: 1
                detalle:
                  type: string
                  example: Muy bueno, estuvo activo.
                puntuacion:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
      responses:
        '201':
          description: Reseña creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reseña'
        '400':
          description: Datos inválidos o puntuación fuera de rango (1-5).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Solo se puede calificar si la entrada fue utilizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Evento o comprador no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Reseña:
      type: object
      properties:
        id:
          type: integer
          example: 1
        comprador:
          $ref: '#/components/schemas/Usuario'
        evento:
          $ref: '#/components/schemas/Evento'
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        detalle:
          type: string
          example: Muy bueno, estuvo muy activo.
    Error:
      type: object
      properties:
        error:
          type: boolean
          example: true
        message:
          type: string
          example: puntuacion debe ser un número entre 1 y 5
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - CONFLICT
            - FORBIDDEN
            - INTERNAL_ERROR
          example: VALIDATION_ERROR
