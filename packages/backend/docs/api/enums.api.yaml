openapi: 3.0.0
info:
  title: API - Enums / Estados
  version: 1.0.0
  description: |
    Enumeraciones usadas en la API para estados de compra y otros casos.
servers:
  - url: http://localhost:3000/api
    description: Servidor local de desarrollo
paths: {}
components:
  schemas:
    EstadoCompra:
      type: string
      enum:
        - PENDIENTE
        - CONFIRMADA
        - UTILIZADA
        - CANCELADA
        - REEMBOLSADA
      description: Estado de una compra a lo largo del ciclo de vida de la misma.
    ErrorCode:
      type: string
      example: VALIDATION_ERROR
      description: Código de error utilizados en las respuestas de error.
      enum:
        - VALIDATION_ERROR
        - NOT_FOUND
        - AUTHENTICATION_REQUIRED
        - FORBIDDEN
        - CONFLICT
        - INTERNAL_ERROR
    Error:
      type: object
      properties:
        error:
          type: boolean
          example: true
        message:
          type: string
          example: nombre y descripcion son requeridos
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - CONFLICT
            - FORBIDDEN
            - INTERNAL_ERROR
          example: VALIDATION_ERROR
